[project]
name = "vulcano-app"
version = "0.1.0"
description = "Application for managing telecommunications invoices"
authors = [{ name = "m22600", email = "pacheco.raimundo@marinha.pt" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask (==2.3.2)",
    "mysql-connector-python (==8.0.33)",
    "ldap3 (==2.9.1)",
    "pdfkit (==1.0.0)",
    "pymupdf (==1.22.5)",
    "python-docx (==0.8.11)",
    "flask-mysqldb (>=2.0.0,<3.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
