[project]
name = "app"
version = "0.1.0"
description = "Application for managing telecommunications invoices"
authors = [{ name = "m22600", email = "pacheco.raimundo@marinha.pt" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "mysql-connector-python (==9.4.0)",
    "ldap3 (==2.9.1)",
    "reportlab (==4.4.4)",
    "pdfkit (==1.0.0)",
    "pymupdf (==1.26.5)",
    "python-docx (==1.2.0)",
    "flask-mysqldb (>=2.0.0,<3.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "flask-wtf (>=1.2.2,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "cryptography (>=46.0.3,<47.0.0)",
]

[tool.poetry]
packages = [{ include = "app", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "types-flask-sqlalchemy (>=2.5.9.4,<3.0.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]
