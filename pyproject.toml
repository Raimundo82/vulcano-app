[project]
name = "app"
version = "0.1.0"
description = "Application for managing telecommunications invoices"
authors = [{ name = "m22600", email = "pacheco.raimundo@marinha.pt" }]
requires-python = ">=3.10,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "mysql-connector-python (==9.6.0)",
    "ldap3 (==2.9.1)",
    "reportlab (==4.4.10)",
    "pdfkit (==1.0.0)",
    "pymupdf (==1.26.5)",
    "python-docx (==1.2.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "docx (>=0.2.4,<0.3.0)",
]

[tool.poetry]
packages = [{ include = "app", from = "src" }]

[build-system]
requires = ["poetry-core>=2.3.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "isort (>=7.0.0,<8.0.0)",
    "autoflake (>=2.3.3,<3.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
