[project]
name = "app"
version = "0.1.0"
description = "Application for managing telecommunications invoices"
authors = [{ name = "m22600", email = "pacheco.raimundo@marinha.pt" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "mysql-connector-python (==9.4.0)",
    "ldap3 (==2.9.1)",
    "reportlab (==4.4.4)",
    "pdfkit (==1.0.0)",
    "pymupdf (==1.26.5)",
    "python-docx (==1.2.0)",
    "flask-mysqldb (>=2.0.0,<3.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
]

[tool.poetry]
packages = [{ include = "app", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
