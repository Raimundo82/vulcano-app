name: PR SonarQube Analysis

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

env:
  RUNNER_TOOL_CACHE: /toolcache

jobs:
  pr-sonarscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name: Run tests with coverage
        env:
          CI: true 
          FLASK_ENV: development
        run: |
          poetry run pytest --maxfail=1 --disable-warnings -q --cov=src --cov-report=xml

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.pullrequest.key=${{ gitea.event.number }}
            -Dsonar.pullrequest.branch=${{ gitea.head_ref }}
            -Dsonar.pullrequest.base=${{ gitea.base_ref }}

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
