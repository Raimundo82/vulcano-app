name: Release Image on Tag

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Print context
        run: |
          echo "gitea.ref   = ${{ gitea.ref }}"
          echo "gitea.tag   = ${{ gitea.tag }}"
          echo "gitea.sha   = ${{ gitea.sha }}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Log in to registry
        run: docker login ${{ vars.REGISTRY_SERVER }} -u ${{ vars.USERNAME }} -p ${{ secrets.PACKAGE_UPLOAD_TOKEN }}

      - name: Promote previous latest to stable
        run: |
          echo "Promoting previous latest to stable..."
          docker pull ${{ vars.REGISTRY_SERVER }}/marinha-si/vulcano-app:latest || echo "No previous latest found"
          docker tag ${{ vars.REGISTRY_SERVER }}/marinha-si/vulcano-app:latest ${{ vars.REGISTRY_SERVER }}/marinha-si/vulcano-app:stable || true
          docker push ${{ vars.REGISTRY_SERVER }}/marinha-si/vulcano-app:stable || true

      - name: Build image
        run: |
          docker build -t ${{ vars.REGISTRY_SERVER }}/marinha-si/vulcano-app:latest .

      - name: Push images
        run: |
          docker push ${{ vars.REGISTRY_SERVER }}/marinha-si/vulcano-app:latest

      - name: Download Kubectl binaries
        run: curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"

      - name: Install Kubectl
        run: sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Extract base64 encoded config
        run: echo "${{ secrets.KUBECONFIG_DSI_PAAS_ENCODED }}" | base64 -d > /tmp/config

      - name: Apply pvc, deployment, service, route
        run: kubectl --kubeconfig=/tmp/config -n ${{ vars.DSI_PAAS_NS }} apply -f k8s/app/

      - name: Restart deployment to pull new latest
        run: |
          kubectl --kubeconfig=/tmp/config -n ${{ vars.DSI_PAAS_NS }} rollout restart deployment/vulcano-app
