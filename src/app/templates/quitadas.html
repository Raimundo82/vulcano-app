<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faturas Quitadas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 20px;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
        }
        .card-header {
            background-color: #007bff;
            color: #fff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .dataTables_wrapper {
            padding: 20px;
        }
        .dataTables_filter input {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 5px;
        }
        .btn-custom {
            margin-top: 20px;
        }
        .container-fluid {
            padding: 0 20px;
        }
        .table-responsive {
            width: 100%;
        }
        .delete-button {
            display: none; /* Esconde o botão por padrão */
            margin-top: 20px;
        }

        .cliente-destaque {
        color: blue;
        font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="card">
            <div class="card-header">
                <h1 class="h4 mb-0">Faturas Quitadas</h1>
            </div>
            <div class="card-body">
                <!-- Filtros de Ano e Mês -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label for="ano" class="form-label">Ano:</label>
                        <select id="ano" class="form-select">
                            <option value="">Todos</option>
                            <!-- Opções de anos serão preenchidas dinamicamente -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="mes" class="form-label">Mês:</label>
                        <select id="mes" class="form-select">
                            <option value="">Todos</option>
                            <!-- Opções de meses serão preenchidas dinamicamente -->
                        </select>
                    </div>
                </div>

                <!-- Tabela de Faturas -->
                <div class="table-responsive">
                    <table id="faturasTable" class="display" style="width:100%">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Fatura</th>
                                <th>Emissão</th>
                                <th>Conta</th>
                                <th>Cliente</th>
                                <th>Ano</th>
                                <th>Mês</th>
                                <th>Divida</th>
                                <th>Pagar</th>
                                <th>M12M</th>
                                <th>Saldo</th>
                                <th>Quitada em</th>
                                <th>
                                    <input type="checkbox" id="quitarTodos" {% if not is_admin %}disabled{% endif %}> Quitar
                                </th>
                                <th>
                                    <input type="checkbox" id="eliminarTodos" {% if not is_admin %}disabled{% endif %}> Eliminar
                                </th>
                                <th>PAP</th>
                                <th>Valor Faturado</th>
                                <th>MEO estado</th>
                                <th>OBS.</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dados das faturas serão preenchidos dinamicamente -->
                        </tbody>
                    </table>
                </div>

                <!-- Total Mensal -->
                <h5 class="mt-3">Total Mensal: <span id="totalMensal">0.00 €</span></h5>

            </div>
        </div>
        <a href="/" class="btn btn-secondary btn-custom">Voltar à Página Inicial</a>

        <button id="exportExcel" class="btn btn-success btn-custom">Exportar para Excel</button>
        <!-- Botão Eliminar -->
        <button id="eliminarButton" class="btn btn-danger delete-button" {% if not is_admin %}disabled{% endif %}>Eliminar Selecionados</button>

    </div>

    <!-- jQuery -->
    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}"></script>

    <!-- DataTables JS -->
    <script type="text/javascript" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script>
        const contasBLM ={{contas_blm | tojson |safe}};
        const is_admin = {{ is_admin | tojson | safe }};
    </script>

    <script>
    $(document).ready(function() {
        var table = $('#faturasTable').DataTable({
            "ajax": {
                "url": "/api/quitadas",
                "dataSrc": ""
            },
            "columns": [

                { "data": "invoice_type"},

                {
                    "data": "invoice_number",
                    "render": function(data, type, row) {
                        return `<a href="/processed/${row.invoice_period_year}/${row.invoice_period_month}/${row.pdffile}" target="_blank">${data}</a>`;
                    }
                },
                {
                    "data": "issue_date",
                    "render": function(data, type, row) {
                        if (data) {
                            const date = new Date(data);
                            const day = String(date.getDate()).padStart(2, '0');
                            const month = String(date.getMonth() + 1).padStart(2, '0');
                            const year = date.getFullYear();
                            return `${day}/${month}/${year}`;
                        }
                        return "N/A";
                    }
                },
                {
                    "data": "account_number",
                    "render": function(data, type, row) {
                        return `<a href="/account/${data}">${data}</a>`;
                    }
                },
                { "data": "client",
                        "render": function(data, type, row) {
                        return contasBLM.includes(row.account_number)
                        ? `<span class="cliente-destaque">${data}</span>`
                        : data;
                        }
                },
                { "data": "invoice_period_year" },
                { "data": "invoice_period_month" },
                {
                    "data": "amount_to_pay",
                    "render": function(data, type, row) {
                        var amountToPay = parseFloat(data);
                        var totalAmount = parseFloat(row.total_amount);
                        if (amountToPay < totalAmount) {
                            return `<span style="color: orange; font-weight: bold;">${data}</span>`;
                        } else {
                            return data;
                        }
                    }
                },
                {
                    "data": "total_amount",
                    "render": function(data, type, row) {
                        // Convert data and media to floats for comparison
                        var totalAmount = parseFloat(data);
                        var media = parseFloat(row.media);

                        // Check if total_amount is 15% greater than media
                        if (totalAmount > media * 1.15) {
                            return `<span style="font-weight: bold; color: red;">${data}</span>`;
                        } else {
                            return data;
                        }
                    }
                },
                {
                    "data": "media",
                    "render": function(data, type, row) {
                        // Formata o valor da média para 2 casas decimais
                        return data ? `${parseFloat(data).toFixed(2)}` : "N/A";
                    }
                },

                {"data": "balance",
                    "render": function(data, type, row) {
                        // Converte vírgula para ponto para fazer o parseFloat corretamente
                        const valor = String(data).replace(',', '.');
                        const totalAmount = parseFloat(valor);

                        // Define a cor do input se o valor estiver diferente de valor a pagar
                        const styleColor = totalAmount < 0 ? 'red; font-weight:bold;' : '';

                        return `
                            <input type="text"
                                class="balanceInput"
                                value="${data}"
                                data-invoice-number="${row.invoice_number}"
                                style="width:100%; border:none; padding:3px; color:${styleColor}"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                ${!is_admin ? 'disabled' : ''}>
                        `;
                    }
                },




                { "data": "quita_date" },
                {
                    "data": "quitar",
                    "render": function(data, type, row) {
                        return `<input type="checkbox" class="quitarCheckbox" data-invoice-number="${row.invoice_number}" ${data ? 'checked' : ''} {% if not is_admin %}disabled{% endif %}>`;
                    }
                },
                {
                    "data": null,
                    "render": function(data, type, row) {
                        return `<input type="checkbox" class="eliminarCheckbox"
                                    data-invoice-number="${row.invoice_number}"
                                    data-pdf-file="${row.pdffile}"
                                    data-invoice-year="${row.invoice_period_year}"
                                    data-invoice-month="${row.invoice_period_month}"
                                    {% if not is_admin %}disabled{% endif %}>`;
                    }
                },
                { "data": "pap",

                "render": function(data, type, row) {

                    const valor = data;

                    return `
                        <input type="number"
                            class="papInput"
                            value="${valor}"
                            data-invoice-number="${row.invoice_number}"
                            style="width:100%; border:none; padding:3px;"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            ${!is_admin ? 'disabled' : ''}>
                    `;
                    }
                },


                { "data": "invoiced",

                "render": function(data, type, row) {
                        // Converte vírgula para ponto para fazer o parseFloat corretamente
                        const valor = String(data).replace(',', '.');
                        const totalAmount = parseFloat(valor);
                        const total = parseFloat(String(row.total_amount).replace(',', '.'));

                        // Define a cor do input se o valor estiver diferente de valor a pagar
                        const styleColor = totalAmount !== total ? 'red; font-weight:bold;' : '';

                        return `
                            <input type="text"
                                class="invoicedInput"
                                value="${data}"
                                data-invoice-number="${row.invoice_number}"
                                data-total-amount="${row.total_amount}"
                                style="width:100%; border:none; padding:3px; color:${styleColor}"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                ${!is_admin ? 'disabled' : ''}>
                        `;
                    }
                },


                { "data": "meo_estado",
                        "render": function(data, type, row) {

                            const valor = (data || "").trim();

                            if (type === 'filter' || type === 'sort') {
                                return valor;
                            }

                            const options = [
                                "Liquidada",
                                "Liqui. NC",
                                "Em Aberto",
                                "Vencida"
                            ];

                            // criar lista de opções <datalist>
                            const listaId = `lista_meo_estado_${row.invoice_number}`;
                            const optionsHtml = options.map(op => `<option value="${op}">`).join('');

                            return `
                                <input type="text"
                                    class="meo_estadoInput"
                                    list="${listaId}"
                                    value="${valor}"
                                    data-invoice-number="${row.invoice_number}"
                                    style="width:100%; border:none; padding:3px;"
                                    ${!is_admin ? 'disabled' : ''}>

                                <datalist id="${listaId}">
                                    ${optionsHtml}
                                </datalist>
                            `;
                        }
                    },



                {
                        "data": "obs",
                        "render": function(data, type, row) {

                            const valor = (data || "").trim();

                            // 🔥 IMPORTANTE: para pesquisa e ordenação devolver TEXTO
                            if (type === 'filter' || type === 'sort') {
                                return valor;
                            }

                            const options = [
                                "NIL",
                                "Média baixa porque o 1º período de faturação foi inferior a um mês",
                                "Tarifa de dados irregular",
                                "Média baixou com a introdução de faturas do mês seguinte",
                                "Necessário extrato detalhado - para proceder á validação",
                                "Aumento do numero de  comunicações",
                                "Roaming",
                                "Numero de emergência no mar",
                                "SEOO",
                                "Aguarda resposta da MEO",
                                "Reportado á UEO",
                                "Validado pelo POC da unidade por email",
                                "Aguarda validação do POC da UEO",
                                "Adicionados novos serviços",
                                "Paga pela UEO",
                                "Paga pela UEO / Roaming",
                                "Irregular-Conteúdos - Digitais especiais",
                                "Saldo irregular erro DCOF, quitada com valor 0€, MEO alocar saldo",
                                "Correção do saldo, Paga pelo valor da divida",
                                "Saldo Corrigido"
                            ];

                            // criar lista de opções <datalist>
                            const listaId = `listaObs_${row.invoice_number}`;
                            const optionsHtml = options.map(op => `<option value="${op}">`).join('');

                            return `
                                <input type="text"
                                    class="obsInput"
                                    list="${listaId}"
                                    value="${valor}"
                                    data-invoice-number="${row.invoice_number}"
                                    style="width:100%; border:none; padding:3px;"
                                    ${!is_admin ? 'disabled' : ''}>

                                <datalist id="${listaId}">
                                    ${optionsHtml}
                                </datalist>
                            `;
                        }
                    }

            ],
            "columnDefs": [
                { "targets": [11, 12], "orderable": false }
            ]
        });


        // Atualiza o total mensal
        function updateTotalMensal() {
            var total = 0;
            table.rows({ search: 'applied' }).data().each(function(row) {
                if (row.total_amount) {
                    total += parseFloat(row.total_amount);
                }
            });
            $('#totalMensal').text(total.toFixed(2) + ' €');
        }

        // Filtros de Ano e Mês
        $('#ano, #mes').on('change', function() {
            var ano = $('#ano').val();
            var mes = $('#mes').val();
            table.column(5).search(ano).column(6).search(mes).draw();
            updateTotalMensal();
        });

        // Carrega os anos e meses disponíveis
        $.get("/api/faturas", function(data) {
            var anos = [...new Set(data.map(item => item.invoice_period_year))];
            var meses = [...new Set(data.map(item => item.invoice_period_month))];

            anos.forEach(function(ano) {
                $('#ano').append(`<option value="${ano}">${ano}</option>`);
            });

            meses.forEach(function(mes) {
                $('#mes').append(`<option value="${mes}">${mes}</option>`);
            });
        });

        // Atualiza o status de "Quitar" ao alterar a caixa de seleção
        $('#faturasTable').on('change', '.quitarCheckbox', function() {
            var invoiceNumber = $(this).data('invoice-number');
            var isQuitado = $(this).is(':checked');

            $.ajax({
                url: `/api/faturas/${invoiceNumber}/quitar`,
                method: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({ quitar: isQuitado }),
                success: function(response) {
                    console.log('Status de "Quitar" atualizado com sucesso!'); // Log no console
                },
                error: function() {
                    console.error('Erro ao atualizar o status de "Quitar".'); // Log de erro no console
                }
            });
        });

        // Atualizar OBS ao editar o campo
            $('#faturasTable').on('change', '.obsInput', function () {
                var invoiceNumber = $(this).data('invoice-number');
                var newObs = $(this).val();

                $.ajax({
                    url: `/api/quitadas/${invoiceNumber}/obs`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ obs: newObs }),
                    success: function () {
                        console.log("OBS atualizada com sucesso!");
                    },
                    error: function () {
                        console.error("Erro ao atualizar a OBS.");
                    }
                });
            });

        // Atualizar meo_estado ao editar o campo
            $('#faturasTable').on('change', '.meo_estadoInput', function () {
                var invoiceNumber = $(this).data('invoice-number');
                var newMeoEstado = $(this).val();
                $.ajax({
                    url: `/api/quitadas/${invoiceNumber}/meo_estado`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ meo_estado: newMeoEstado }),
                    success: function () {
                        console.log("Meo estado atualizado com sucesso!");
                    },
                    error: function () {
                        console.error("Erro ao atualizar o Meo estado.");
                    }
                });
            });

            // Atualizar PAP ao editar o campo
            $('#faturasTable').on('change', '.papInput', function () {
                var invoiceNumber = $(this).data('invoice-number');
                var newPap = $(this).val();
                //newPap = "1234"
                $.ajax({
                    url: `/api/quitadas/${invoiceNumber}/pap`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ pap: newPap }),
                    success: function () {
                        console.log("PAP atualizada com sucesso!");
                    },
                    error: function () {
                        console.error("Erro ao atualizar o PAP.");
                    }
                });
            });


            // Atualizar balanceInput ao editar o campo
            $('#faturasTable').on('change', '.balanceInput', function () {
                var invoiceNumber = $(this).data('invoice-number');

                var rawValue = $(this).val();          // ex: "1,25"
                var normalized = rawValue.replace(',', '.');
                var newBalance = parseFloat(normalized);

                if (isNaN(newBalance)) {
                    console.error("Valor decimal inválido:", rawValue);
                    return;
                }


                $.ajax({
                    url: `/api/${invoiceNumber}/balance`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ balance: newBalance }),
                    success: function () {
                        console.log("balance atualizada com sucesso!");
                    },
                    error: function () {
                        console.error("Erro ao atualizar o balance.");
                    }
                });
            });





            // Atualizar invoiced ao editar o campo
            $('#faturasTable').on('change', '.invoicedInput', function () {
                var invoiceNumber = $(this).data('invoice-number');
                var total = parseFloat(String($(this).data('total-amount')).replace(',', '.'));

                var rawValue = $(this).val();          // ex: "1,25"
                var normalized = rawValue.replace(',', '.');
                var newInvoiced = parseFloat(normalized);

                if (isNaN(newInvoiced)) {
                    console.error("Valor decimal inválido:", rawValue);
                    return;
                }

                if (newInvoiced !== total) {
                    alert('⚠️ O valor faturado não pode ser diferente do valor a pagar.');
                }


                $.ajax({
                    url: `/api/quitadas/${invoiceNumber}/invoiced`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ invoiced: newInvoiced }),
                    success: function () {
                        console.log("Invoiced atualizada com sucesso!");
                    },
                    error: function () {
                        console.error("Erro ao atualizar o Invoiced.");
                    }
                });
            });



        // Marcar/Desmarcar todos os checkboxes visíveis
        $('#quitarTodos').on('change', function() {
            var isChecked = $(this).is(':checked');
            table.rows({ search: 'applied' }).nodes().to$().find('.quitarCheckbox').prop('checked', isChecked);

            // Atualiza o status de "Quitar" para todos os checkboxes marcados/desmarcados
            table.rows({ search: 'applied' }).data().each(function(row) {
                var invoiceNumber = row.invoice_number;
                $.ajax({
                    url: `/api/faturas/${invoiceNumber}/quitar`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ quitar: isChecked }),
                    success: function(response) {
                        console.log(`Status de "Quitar" atualizado para a fatura ${invoiceNumber}`);
                    },
                    error: function() {
                        console.log(`Erro ao atualizar o status de "Quitar" para a fatura ${invoiceNumber}`);
                    }
                });
            });
        });


        // Marcar/Desmarcar todos os checkboxes de eliminação (incluindo todas as páginas)
        $('#eliminarTodos').on('change', function() {
            var isChecked = $(this).is(':checked');
            table.rows({ search: 'applied' }).nodes().to$().find('.eliminarCheckbox').prop('checked', isChecked);
            $('#eliminarButton').toggle(isChecked);
        });

        // Mostrar/Esconder o botão Eliminar
        $('#faturasTable').on('change', '.eliminarCheckbox', function() {
            var anyChecked = table.rows({ search: 'applied' }).nodes().to$().find('.eliminarCheckbox:checked').length > 0;
            $('#eliminarButton').toggle(anyChecked);
        });

        // Botão Eliminar
        $('#eliminarButton').on('click', function() {
            var invoicesToDelete = [];

            // Coleta todos os checkboxes marcados (incluindo todas as páginas)
            table.rows({ search: 'applied' }).nodes().to$().find('.eliminarCheckbox:checked').each(function() {
                var invoiceNumber = $(this).data('invoice-number');
                var pdfFile = $(this).data('pdf-file');
                var invoiceYear = $(this).data('invoice-year');
                var invoiceMonth = $(this).data('invoice-month');
                invoicesToDelete.push({
                    invoiceNumber: invoiceNumber,
                    pdfFile: pdfFile,
                    invoiceYear: invoiceYear,
                    invoiceMonth: invoiceMonth
                });
            });

            if (invoicesToDelete.length > 0) {
                if (confirm('Tem a certeza que deseja eliminar as faturas selecionadas?')) {
                    $.ajax({
                        url: '/api/faturas/eliminar',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({ invoices: invoicesToDelete }),
                        success: function(response) {
                            alert('Faturas eliminadas com sucesso!');
                            table.ajax.reload(); // Recarrega a tabela após eliminação
                            $('#eliminarButton').hide(); // Esconde o botão após eliminação
                        },
                        error: function(xhr, status, error) {
                            // Exibe a mensagem de erro retornada pelo backend
                            var errorMessage = xhr.responseJSON ? xhr.responseJSON.error : "Erro ao eliminar faturas.";
                            alert(errorMessage);
                        }
                    });
                }
            } else {
                alert('Nenhuma fatura selecionada para eliminar.');
            }
        });

        // Botão para gerar o PDF de quitação
        $('#gerarQuitacao').on('click', function() {
            // Abre o PDF de quitação em uma nova aba
            window.open('/quitar-faturas', '_blank');
        });

        // Atualiza o total mensal ao carregar a página
        table.on('draw', function() {
            updateTotalMensal();
        });

        $('#exportExcel').on('click', function () {

            // Obter apenas as linhas visíveis (com filtros aplicados)
            const dados = [];

            table.rows({ search: 'applied' }).data().each(function (row) {
                dados.push({
                    "Tipo": row.invoice_type,
                    "Fatura": row.invoice_number,
                    "Emissão": formatarDataPT(row.issue_date),
                    "Conta": row.account_number,
                    "Cliente": row.client,
                    "Ano": row.invoice_period_year,
                    "Mês": row.invoice_period_month,
                    "Divida": numeroOuNIL(row.amount_to_pay),
                    "Pagar": numeroOuNIL(row.total_amount),
                    "M12M": numeroOuNIL(row.media),
                    "Saldo": numeroOuNIL(row.balance),
                    "Quitada em": row.quita_date,
                    "PAP": row.pap,
                    "Valor Faturado": parseFloat(String(row.invoiced).replace(',', '.')),
                    "MEO estado": row.meo_estado,
                    "OBS": row.obs
                });
            });

            if (dados.length === 0) {
                alert("Não existem dados para exportar.");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(dados);

            // 1) Ativar filtros automáticos na linha do cabeçalho
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            worksheet['!autofilter'] = {
                ref: XLSX.utils.encode_range(range)
                };

            // 2) Ajustar largura das colunas ao conteúdo
            const colWidths = [];

            dados.forEach(row => {
                    Object.values(row).forEach((val, i) => {
                        const tamanho = val ? String(val).length : 0;
                        colWidths[i] = Math.max(colWidths[i] || 10, tamanho + 2);
                    });
                });

            worksheet['!cols'] = colWidths.map(w => ({ wch: w }));



            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Faturas");

            XLSX.writeFile(workbook, "faturas_quitadas.xlsx");
        });

        function numeroOuNIL(valor) {
                if (valor === null || valor === undefined || valor === "") {
                    return "NIL";
                }
                return parseFloat(String(valor).replace(',', '.'));
        }

        function formatarDataPT(data) {
            if (!data) return "";

            const d = new Date(data);
            if (isNaN(d)) return "";

            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const ano = d.getFullYear();

            return `${dia}/${mes}/${ano}`;
        }


    });
    </script>
