<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faturas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 20px;
            /* Margem de 20px em todos os lados */
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            /* Ocupa toda a largura disponível */
        }

        .card-header {
            background-color: #007bff;
            color: #fff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .dataTables_wrapper {
            padding: 20px;
        }

        .dataTables_filter input {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 5px;
        }

        .btn-custom {
            margin-top: 20px;
        }

        .container-fluid {
            padding: 0 20px;
            /* Margem de 20px nas laterais */
        }

        .table-responsive {
            width: 100%;
            /* Ocupa toda a largura disponível */
        }

        .cliente-destaque {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="card">
            <div class="card-header">
                <h1 class="h4 mb-0">Faturas por Quitar</h1>
            </div>
            <div class="card-body">
                <!-- Filtros de Ano e Mês -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label for="ano" class="form-label">Ano:</label>
                        <select id="ano" class="form-select">
                            <option value="">Todos</option>
                            <!-- Opções de anos serão preenchidas dinamicamente -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="mes" class="form-label">Mês:</label>
                        <select id="mes" class="form-select">
                            <option value="">Todos</option>
                            <!-- Opções de meses serão preenchidas dinamicamente -->
                        </select>
                    </div>
                </div>

                <!-- Tabela de Faturas -->
                <div class="table-responsive">
                    <table id="faturasTable" class="display" style="width:100%">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Fatura</th>
                                <th>Emissão</th>
                                <th>Conta</th>
                                <th>Cliente</th>
                                <th>Ano</th>
                                <th>Mês</th>
                                <th>Divida</th>
                                <th>Pagar</th>
                                <th>M12M</th> <!-- Nova coluna -->
                                <th>Saldo</th>
                                <th>Irregular</th>
                                <th>
                                    <input type="checkbox" id="quitarTodos"> Quitar
                                </th>
                                <th>MEO estado</th>
                                <th>OBS.</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dados das faturas serão preenchidos dinamicamente -->
                        </tbody>
                    </table>
                </div>

                <!-- Total Mensal -->
                <h5 class="mt-3">Valor total mensal por quitar: <span id="totalMensal">0.00 €</span></h5>
            </div>
        </div>
        <a href="/" class="btn btn-secondary btn-custom" id="voltarInicio">Voltar à Página Inicial</a>
        <button id="quitarMarcadas" class="btn btn-primary btn-custom">
            <i class="fas fa-check"></i> Quitar Faturas selecionadas
        </button>
        <button id="exportExcel" class="btn btn-success btn-custom">Exportar para Excel</button>
    </div>

    <!-- jQuery -->
    <!-- script src="https://code.jquery.com/jquery-3.6.0.min.js"></script -->

    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}"></script>

    <!-- DataTables JS -->
    <script type="text/javascript" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Add to your head section -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script>
        const contasBLM = {{ contas_blm | tojson | safe}};
        const is_admin = {{ is_admin | tojson | safe }};
    </script>

    <script>
        $(document).ready(function () {
            var table = $('#faturasTable').DataTable({
                "ajax": {
                    "url": "/api/faturas",
                    "dataSrc": ""
                },
                "columns": [

                    { "data": "invoice_type" },
                    {
                        "data": "invoice_number",
                        "render": function (data, type, row) {
                            return `<a href="/processed/${row.invoice_period_year}/${row.invoice_period_month}/${row.pdffile}" target="_blank">${data}</a>`;
                        }
                    },
                    {
                        "data": "issue_date",
                        "render": function (data, type, row) {
                            // Formata a data para o formato dd/mm/aaaa
                            if (data) {
                                const date = new Date(data);
                                const day = String(date.getDate()).padStart(2, '0'); // Dia com dois dígitos
                                const month = String(date.getMonth() + 1).padStart(2, '0'); // Mês com dois dígitos
                                const year = date.getFullYear();
                                return `${day}/${month}/${year}`;
                            }
                            return "N/A"; // Caso a data seja nula ou inválida
                        }
                    },
                    {
                        "data": "account_number",
                        "render": function (data, type, row) {
                            return `<a href="/account/${data}">${data}</a>`;
                        }
                    },

                    {
                        "data": "client",
                        "render": function (data, type, row) {
                            return contasBLM.includes(row.account_number)
                                ? `<span class="cliente-destaque">${data}</span>`
                                : data;
                        }

                    },






                    // { "data": "cvp" },
                    { "data": "invoice_period_year" },
                    { "data": "invoice_period_month" },

                    {
                        "data": "amount_to_pay",
                        "render": function (data, type, row) {
                            var amountToPay = parseFloat(data);
                            var totalAmount = parseFloat(row.total_amount);
                            if (amountToPay < totalAmount) {
                                return `<span style="color: orange; font-weight: bold;">${data}</span>`;
                            } else {
                                return data;
                            }
                        }
                    },




                    {
                        "data": "total_amount",
                        "render": function (data, type, row) {
                            // Convert data and media to floats for comparison
                            var totalAmount = parseFloat(data);
                            var media = parseFloat(row.media);

                            // Check if total_amount is 15% greater than media
                            if (totalAmount > media * 1.15) {
                                return `<span style="font-weight: bold; color: red;">${data}</span>`;
                            } else {
                                return data;
                            }
                        }
                    },
                    {
                        "data": "media",
                        "render": function (data, type, row) {
                            // Formata o valor da média para 2 casas decimais
                            return data ? `${parseFloat(data).toFixed(2)}` : "N/A";
                        }
                    },

                    {"data": "balance",
                    "render": function(data, type, row) {
                        // Converte vírgula para ponto para fazer o parseFloat corretamente
                        const valor = String(data).replace(',', '.');
                        const totalAmount = parseFloat(valor);

                        // Define a cor do input se o valor estiver diferente de valor a pagar
                        const styleColor = totalAmount < 0 ? 'red; font-weight:bold;' : '';

                        return `
                            <input type="text"
                                class="balanceInput"
                                value="${data}"
                                data-invoice-number="${row.invoice_number}"
                                style="width:100%; border:none; padding:3px; color:${styleColor}"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                ${!is_admin ? 'disabled' : ''}>
                        `;
                    }
                    },


                    {
                        "data": "irregular",
                        "render": function (data, type, row) {



                            return `<input type="checkbox" class="irregularCheckbox" data-invoice-number="${row.invoice_number}" ${data ? 'checked' : ''} ${!is_admin ? 'disabled' : ''} >`;
                        }
                    },


                    {
                        "data": "quitar",
                        "render": function (data, type, row) {

                            return `<input type="checkbox" class="quitarCheckbox" data-invoice-number="${row.invoice_number}" ${data ? 'checked' : ''} ${!is_admin ? 'disabled' : ''} >`;
                        }
                    },

                    { "data": "meo_estado",
                        "render": function(data, type, row) {

                            const valor = (data || "").trim();

                            // 🔥 IMPORTANTE: para pesquisa e ordenação devolver TEXTO
                            if (type === 'filter' || type === 'sort') {
                                return valor;
                            }

                            const options = [
                                "Liquidada",
                                "Liqui. NC",
                                "Em Aberto",
                                "Vencida"
                            ];

                            // criar lista de opções <datalist>
                            const listaId = `lista_meo_estado_${row.invoice_number}`;
                            const optionsHtml = options.map(op => `<option value="${op}">`).join('');

                            return `
                                <input type="text"
                                    class="meo_estadoInput"
                                    list="${listaId}"
                                    value="${valor}"
                                    data-invoice-number="${row.invoice_number}"
                                    style="width:100%; border:none; padding:3px;"
                                    ${!is_admin ? 'disabled' : ''}>

                                <datalist id="${listaId}">
                                    ${optionsHtml}
                                </datalist>
                            `;
                        }
                    },


                    {
                        "data": "obs",
                        "render": function(data, type, row) {

                            const valor = (data || "").trim();

                            // 🔥 IMPORTANTE: para pesquisa e ordenação devolver TEXTO
                            if (type === 'filter' || type === 'sort') {
                                return valor;
                            }

                            const options = [
                                "NIL",
                                "Média baixa porque o 1º período de faturação foi inferior a um mês",
                                "Tarifa de dados irregular",
                                "Média baixou com a introdução de faturas do mês seguinte",
                                "Necessário extrato detalhado - para proceder á validação",
                                "Aumento do numero de  comunicações",
                                "Roaming",
                                "Numero de emergência no mar",
                                "SEOO",
                                "Aguarda resposta da MEO",
                                "Reportado á UEO",
                                "Validado pelo POC da unidade por email",
                                "Aguarda validação do POC da UEO",
                                "Adicionados novos serviços",
                                "Paga pela UEO",
                                "Paga pela UEO / Roaming",
                                "Irregular-Conteúdos - Digitais especiais",
                                "Saldo irregular erro DCOF, quitada com valor 0€, MEO alocar saldo",
                                "Correção do saldo, Paga pelo valor da divida",
                                "Saldo Corrigido"
                            ];

                            // criar lista de opções <datalist>
                            const listaId = `listaObs_${row.invoice_number}`;
                            const optionsHtml = options.map(op => `<option value="${op}">`).join('');

                            return `
                                <input type="text"
                                    class="obsInput"
                                    list="${listaId}"
                                    value="${valor}"
                                    data-invoice-number="${row.invoice_number}"
                                    style="width:100%; border:none; padding:3px;"
                                    ${!is_admin ? 'disabled' : ''}>

                                <datalist id="${listaId}">
                                    ${optionsHtml}
                                </datalist>
                            `;
                        }
                    }






                ],
                "columnDefs": [
                    { "targets": [10], "orderable": false }
                ]
            });

            // Atualiza o total mensal
            function updateTotalMensal() {
                var total = 0;
                table.rows({ search: 'applied' }).data().each(function (row) {
                    if (row.total_amount && row.irregular == 0) {
                        total += parseFloat(row.total_amount);
                    }
                });
                $('#totalMensal').text(total.toFixed(2) + ' €');
            }

            // Filtros de Ano e Mês
            $('#ano, #mes').on('change', function () {
                var ano = $('#ano').val();
                var mes = $('#mes').val();
                table.column(5).search(ano).column(6).search(mes).draw();
                updateTotalMensal();
            });

            // Carrega os anos e meses disponíveis
            $.get("/api/faturas", function (data) {
                var anos = [...new Set(data.map(item => item.invoice_period_year))];
                var meses = [...new Set(data.map(item => item.invoice_period_month))];

                anos.forEach(function (ano) {
                    $('#ano').append(`<option value="${ano}">${ano}</option>`);
                });

                meses.forEach(function (mes) {
                    $('#mes').append(`<option value="${mes}">${mes}</option>`);
                });
            });

            // Atualiza o status de "Quitar" ao alterar a caixa de seleção
            $('#faturasTable').on('change', '.quitarCheckbox', function () {
                var invoiceNumber = $(this).data('invoice-number');
                var isQuitado = $(this).is(':checked');

                $.ajax({
                    url: `/api/faturas/${invoiceNumber}/quitar`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ quitar: isQuitado }),
                    success: function (response) {
                        console.log('Status de "Quitar" atualizado com sucesso!'); // Log no console
                    },
                    error: function () {
                        console.error('Erro ao atualizar o status de "Quitar".'); // Log de erro no console
                    }
                });
            });

            // Atualizar meo_estado ao editar o campo
            $('#faturasTable').on('change', '.meo_estadoInput', function () {
                var invoiceNumber = $(this).data('invoice-number');
                var newMeoEstado = $(this).val();
                $.ajax({
                    url: `/api/faturas/${invoiceNumber}/meo_estado`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ meo_estado: newMeoEstado }),
                    success: function () {
                        console.log("Meo estado atualizado com sucesso!");
                    },
                    error: function () {
                        console.error("Erro ao atualizar o Meo estado.");
                    }
                });
            });

            // Atualizar balanceInput ao editar o campo
            $('#faturasTable').on('change', '.balanceInput', function () {
                var invoiceNumber = $(this).data('invoice-number');

                var rawValue = $(this).val();          // ex: "1,25"
                var normalized = rawValue.replace(',', '.');
                var newBalance = parseFloat(normalized);

                if (isNaN(newBalance)) {
                    console.error("Valor decimal inválido:", rawValue);
                    return;
                }


                $.ajax({
                    url: `/api/${invoiceNumber}/balance`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ balance: newBalance }),
                    success: function () {
                        console.log("balance atualizada com sucesso!");
                    },
                    error: function () {
                        console.error("Erro ao atualizar o balance.");
                    }
                });
            });


             // Atualiza o status de "Irregular" ao alterar a caixa de seleção
            $('#faturasTable').on('change', '.irregularCheckbox', function () {
                var invoiceNumber = $(this).data('invoice-number');
                var isIrregular = $(this).is(':checked');

                $.ajax({
                    url: `/api/faturas/${invoiceNumber}/irregular`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ irregular: isIrregular }),
                    success: function (response) {
                        console.log('Status de "Irregular" atualizado com sucesso!'); // Log no console
                    },
                    error: function () {
                        console.error('Erro ao atualizar o status de "Irregular".'); // Log de erro no console
                    }
                });
            });

            // Marcar/Desmarcar todos os checkboxes visíveis
            $('#quitarTodos').on('change', function () {
                var isChecked = $(this).is(':checked');
                table.rows({ search: 'applied' }).nodes().to$().find('.quitarCheckbox').prop('checked', isChecked);

                // Atualiza o status de "Quitar" para todos os checkboxes marcados/desmarcados
                table.rows({ search: 'applied' }).data().each(function (row) {
                    var invoiceNumber = row.invoice_number;
                    $.ajax({
                        url: `/api/faturas/${invoiceNumber}/quitar`,
                        method: 'PUT',
                        contentType: 'application/json',
                        data: JSON.stringify({ quitar: isChecked }),
                        success: function (response) {
                            console.log(`Status de "Quitar" atualizado para a fatura ${invoiceNumber}`);
                        },
                        error: function () {
                            console.log(`Erro ao atualizar o status de "Quitar" para a fatura ${invoiceNumber}`);
                        }
                    });
                });
            });

            // Atualizar OBS ao editar o campo
            $('#faturasTable').on('change', '.obsInput', function () {
                var invoiceNumber = $(this).data('invoice-number');
                var newObs = $(this).val();

                $.ajax({
                    url: `/api/faturas/${invoiceNumber}/obs`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ obs: newObs }),
                    success: function () {
                        console.log("OBS atualizada com sucesso!");
                    },
                    error: function () {
                        console.error("Erro ao atualizar a OBS.");
                    }
                });
            });



            // Botão para gerar o PDF de quitação
            $('#gerarQuitacao').on('click', function () {
                // Abre o PDF de quitação em uma nova aba
                window.open('/quitar-faturas', '_blank');
            });


            $('#quitarMarcadas').on('click', function () {
                // Coletar as faturas marcadas na interface
                var faturasMarcadas = [];
                table.rows({ search: 'applied' }).nodes().to$().find('.quitarCheckbox:checked').each(function () {
                    var invoiceNumber = $(this).data('invoice-number');
                    faturasMarcadas.push(invoiceNumber);
                });

                if (faturasMarcadas.length === 0) {
                    alert('Nenhuma fatura marcada para quitar.');
                    return;
                }

                $.ajax({
                    url: '/quitar-faturas',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ faturas: faturasMarcadas }),

                    // 🔥 MUITO IMPORTANTE
                    xhrFields: {
                        responseType: 'blob'
                    },

                    success: function (data) {

                        var blob = new Blob([data], { type: 'application/pdf' });
                        var url = window.URL.createObjectURL(blob);

                        var a = document.createElement('a');
                        a.href = url;
                        a.download = "quitacao_faturas.zip";  // ou .zip se for ZIP
                        document.body.appendChild(a);
                        a.click();
                        a.remove();

                        window.URL.revokeObjectURL(url);
                    },



                    error: function (xhr, status, error) {
                        alert('Erro ao gerar o PDF de quitação.');
                        console.error(error);
                    }
                });
            });

            $('#voltarInicio').on('click', function (e) {
                e.preventDefault();

                // Check if any invoices are selected
                if ($('.quitarCheckbox:checked').length > 0) {
                    Swal.fire({
                        title: 'Deseja desmarcar todas as faturas?',
                        text: "Todas as faturas selecionadas serão desmarcadas.",
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonColor: '#3085d6',
                        cancelButtonColor: '#d33',
                        confirmButtonText: 'Sim, desmarcar',
                        cancelButtonText: 'Cancelar'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // Uncheck all checkboxes
                            $('.quitarCheckbox:checked').prop('checked', false);

                            // Update server for each
                            $('.quitarCheckbox').each(function () {
                                var invoiceNumber = $(this).data('invoice-number');
                                $.ajax({
                                    url: `/api/faturas/${invoiceNumber}/quitar`,
                                    method: 'PUT',
                                    contentType: 'application/json',
                                    data: JSON.stringify({ quitar: false })
                                });
                            });

                            // Navigate home
                            window.location.href = '/';
                        }
                    });
                } else {
                    window.location.href = '/';
                }
            });

            // Atualiza o total mensal ao carregar a página
            table.on('draw', function () {
                updateTotalMensal();
            });

            $('#exportExcel').on('click', function () {

            // Obter apenas as linhas visíveis (com filtros aplicados)
            const dados = [];

                table.rows({ search: 'applied' }).data().each(function (row) {
                    dados.push({
                        "Tipo": row.invoice_type,
                        "Fatura": row.invoice_number,
                        "Emissão": formatarDataPT(row.issue_date),
                        "Conta": row.account_number,
                        "Cliente": row.client,
                        "Ano": row.invoice_period_year,
                        "Mês": row.invoice_period_month,
                        "Divida": numeroOuNIL(row.amount_to_pay),
                        "Pagar": numeroOuNIL(row.total_amount),
                        "M12M": numeroOuNIL(row.media),
                        "Saldo": numeroOuNIL(row.balance),
                        "Irregular":row.irregular,
                        "MEO estado": row.meo_estado,
                        "OBS": row.obs
                    });
                });

                if (dados.length === 0) {
                    alert("Não existem dados para exportar.");
                    return;
                }

                const worksheet = XLSX.utils.json_to_sheet(dados);

                // 1) Ativar filtros automáticos na linha do cabeçalho
                const range = XLSX.utils.decode_range(worksheet['!ref']);
                worksheet['!autofilter'] = {
                    ref: XLSX.utils.encode_range(range)
                };

                // 2) Ajustar largura das colunas ao conteúdo
                const colWidths = [];

                dados.forEach(row => {
                    Object.values(row).forEach((val, i) => {
                        const tamanho = val ? String(val).length : 0;
                        colWidths[i] = Math.max(colWidths[i] || 10, tamanho + 2);
                    });
                });

                worksheet['!cols'] = colWidths.map(w => ({ wch: w }));


                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Faturas");

                XLSX.writeFile(workbook, "faturas_nao_quitadas.xlsx");
            });

            function numeroOuNIL(valor) {
                if (valor === null || valor === undefined || valor === "") {
                    return "NIL";
                }
                return parseFloat(String(valor).replace(',', '.'));
            }


            function formatarDataPT(data) {
                if (!data) return "";

                const d = new Date(data);
                if (isNaN(d)) return "";

                const dia = String(d.getDate()).padStart(2, '0');
                const mes = String(d.getMonth() + 1).padStart(2, '0');
                const ano = d.getFullYear();

                return `${dia}/${mes}/${ano}`;
            }


        });
    </script>
</body>

</html>
