<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faturas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 20px;
            /* Margem de 20px em todos os lados */
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            /* Ocupa toda a largura disponível */
        }

        .card-header {
            background-color: #007bff;
            color: #fff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .dataTables_wrapper {
            padding: 20px;
        }

        .dataTables_filter input {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 5px;
        }

        .btn-custom {
            margin-top: 20px;
        }

        .container-fluid {
            padding: 0 20px;
            /* Margem de 20px nas laterais */
        }

        .table-responsive {
            width: 100%;
            /* Ocupa toda a largura disponível */
        }

        .cliente-destaque {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="card">
            <div class="card-header">
                <h1 class="h4 mb-0">Faturas por Quitar</h1>
            </div>
            <div class="card-body">
                <!-- Filtros de Ano e Mês -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label for="ano" class="form-label">Ano:</label>
                        <select id="ano" class="form-select">
                            <option value="">Todos</option>
                            <!-- Opções de anos serão preenchidas dinamicamente -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="mes" class="form-label">Mês:</label>
                        <select id="mes" class="form-select">
                            <option value="">Todos</option>
                            <!-- Opções de meses serão preenchidas dinamicamente -->
                        </select>
                    </div>
                </div>

                <!-- Tabela de Faturas -->
                <div class="table-responsive">
                    <table id="faturasTable" class="display" style="width:100%">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Fatura</th>
                                <th>Emissão</th>
                                <th>NIC</th>
                                <th>Conta</th>
                                <th>Cliente</th>
                                <th>Ano</th>
                                <th>Mês</th>
                                <th>Divida</th>
                                <th>Pagar</th>
                                <th>M12M</th> <!-- Nova coluna -->
                                <th>Validar</th>
                                <th>
                                    <input type="checkbox" id="quitarTodos"> Quitar
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dados das faturas serão preenchidos dinamicamente -->
                        </tbody>
                    </table>
                </div>

                <!-- Total Mensal -->
                <h5 class="mt-3">Valor total mensal por quitar: <span id="totalMensal">0.00 €</span></h5>
            </div>
        </div>
        <a href="/" class="btn btn-secondary btn-custom" id="voltarInicio">Voltar à Página Inicial</a>
        <button id="quitarMarcadas" class="btn btn-primary btn-custom">
            <i class="fas fa-check"></i> Quitar Faturas selecionadas
        </button>
    </div>
    <!-- jQuery -->
    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}"></script>

    <!-- DataTables JS -->
    <script type="text/javascript" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Add to your head section -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const contasBLM = {{ contas_blm | tojson | safe}};
    </script>

    <script>
        $(document).ready(function () {
            var table = $('#faturasTable').DataTable({
                "ajax": {
                    "url": "/api/faturas",
                    "dataSrc": ""
                },
                "columns": [

                    { "data": "invoice_type" },
                    {
                        "data": "invoice_number",
                        "render": function (data, type, row) {
                            return `<a href="/processed/${row.invoice_period_year}/${row.invoice_period_month}/${row.pdffile}" target="_blank">${data}</a>`;
                        }
                    },
                    {
                        "data": "issue_date",
                        "render": function (data, type, row) {
                            // Formata a data para o formato dd/mm/aaaa
                            if (data) {
                                const date = new Date(data);
                                const day = String(date.getDate()).padStart(2, '0'); // Dia com dois dígitos
                                const month = String(date.getMonth() + 1).padStart(2, '0'); // Mês com dois dígitos
                                const year = date.getFullYear();
                                return `${day}/${month}/${year}`;
                            }
                            return "N/A"; // Caso a data seja nula ou inválida
                        }
                    },
                    { "data": "taxpayer_number" },
                    {
                        "data": "account_number",
                        "render": function (data, type, row) {
                            return `<a href="/account/${data}">${data}</a>`;
                        }
                    },

                    {
                        "data": "client",
                        "render": function (data, type, row) {
                            return contasBLM.includes(row.account_number)
                                ? `<span class="cliente-destaque">${data}</span>`
                                : data;
                        }

                    },






                    // { "data": "cvp" },
                    { "data": "invoice_period_year" },
                    { "data": "invoice_period_month" },

                    {
                        "data": "amount_to_pay",
                        "render": function (data, type, row) {
                            var amountToPay = parseFloat(data);
                            var totalAmount = parseFloat(row.total_amount);
                            if (amountToPay < totalAmount) {
                                return `<span style="color: orange; font-weight: bold;">${data}</span>`;
                            } else {
                                return data;
                            }
                        }
                    },




                    {
                        "data": "total_amount",
                        "render": function (data, type, row) {
                            // Convert data and media to floats for comparison
                            var totalAmount = parseFloat(data);
                            var media = parseFloat(row.media);

                            // Check if total_amount is 15% greater than media
                            if (totalAmount > media * 1.15) {
                                return `<span style="font-weight: bold; color: red;">${data}</span>`;
                            } else {
                                return data;
                            }
                        }
                    },
                    {
                        "data": "media",
                        "render": function (data, type, row) {
                            // Formata o valor da média para 2 casas decimais
                            return data ? `${parseFloat(data).toFixed(2)}` : "N/A";
                        }
                    },
                    {
                        "data": "sent_validar",
                        "render": function (data) {
                            return data ? "Sim" : "Não";
                        }
                    },
                    {
                        "data": "quitar",
                        "render": function (data, type, row) {
                            return `<input type="checkbox" class="quitarCheckbox" data-invoice-number="${row.invoice_number}" ${data ? 'checked' : ''}>`;
                        }
                    }
                ],
                "columnDefs": [
                    { "targets": [10], "orderable": false }
                ]
            });

            // Atualiza o total mensal
            function updateTotalMensal() {
                var total = 0;
                table.rows({ search: 'applied' }).data().each(function (row) {
                    if (row.total_amount) {
                        total += parseFloat(row.total_amount);
                    }
                });
                $('#totalMensal').text(total.toFixed(2) + ' €');
            }

            // Filtros de Ano e Mês
            $('#ano, #mes').on('change', function () {
                var ano = $('#ano').val();
                var mes = $('#mes').val();
                table.column(6).search(ano).column(7).search(mes).draw();
                updateTotalMensal();
            });

            // Carrega os anos e meses disponíveis
            $.get("/api/faturas", function (data) {
                var anos = [...new Set(data.map(item => item.invoice_period_year))];
                var meses = [...new Set(data.map(item => item.invoice_period_month))];

                anos.forEach(function (ano) {
                    $('#ano').append(`<option value="${ano}">${ano}</option>`);
                });

                meses.forEach(function (mes) {
                    $('#mes').append(`<option value="${mes}">${mes}</option>`);
                });
            });

            // Atualiza o status de "Quitar" ao alterar a caixa de seleção
            $('#faturasTable').on('change', '.quitarCheckbox', function () {
                var invoiceNumber = $(this).data('invoice-number');
                var isQuitado = $(this).is(':checked');

                $.ajax({
                    url: `/api/faturas/${invoiceNumber}/quitar`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ quitar: isQuitado }),
                    success: function (response) {
                        console.log('Status de "Quitar" atualizado com sucesso!'); // Log no console
                    },
                    error: function () {
                        console.error('Erro ao atualizar o status de "Quitar".'); // Log de erro no console
                    }
                });
            });

            // Marcar/Desmarcar todos os checkboxes visíveis
            $('#quitarTodos').on('change', function () {
                var isChecked = $(this).is(':checked');
                table.rows({ search: 'applied' }).nodes().to$().find('.quitarCheckbox').prop('checked', isChecked);

                // Atualiza o status de "Quitar" para todos os checkboxes marcados/desmarcados
                table.rows({ search: 'applied' }).data().each(function (row) {
                    var invoiceNumber = row.invoice_number;
                    $.ajax({
                        url: `/api/faturas/${invoiceNumber}/quitar`,
                        method: 'PUT',
                        contentType: 'application/json',
                        data: JSON.stringify({ quitar: isChecked }),
                        success: function (response) {
                            console.log(`Status de "Quitar" atualizado para a fatura ${invoiceNumber}`);
                        },
                        error: function () {
                            console.log(`Erro ao atualizar o status de "Quitar" para a fatura ${invoiceNumber}`);
                        }
                    });
                });
            });

            // Botão para gerar o PDF de quitação
            $('#gerarQuitacao').on('click', function () {
                // Abre o PDF de quitação em uma nova aba
                window.open('/quitar-faturas', '_blank');
            });


            $('#quitarMarcadas').on('click', function () {
                // Coletar as faturas marcadas na interface
                var faturasMarcadas = [];
                table.rows({ search: 'applied' }).nodes().to$().find('.quitarCheckbox:checked').each(function () {
                    var invoiceNumber = $(this).data('invoice-number');
                    faturasMarcadas.push(invoiceNumber);
                });

                if (faturasMarcadas.length === 0) {
                    alert('Nenhuma fatura marcada para quitar.');
                    return;
                }

                // Enviar requisição ao servidor para quitar as faturas marcadas
                $.ajax({
                    url: '/quitar-faturas',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ faturas: faturasMarcadas }),
                    success: function (response) {
                        // Abre o PDF gerado em uma nova aba
                        var blob = new Blob([response], { type: 'application/pdf' });
                        var url = URL.createObjectURL(blob);
                        window.open(url, '_blank');

                        // Redireciona para a página index.html após abrir o PDF
                        window.location.href = '/';
                    },
                    error: function (xhr, status, error) {
                        alert('Erro ao gerar o PDF de quitação.');
                        console.error(error);
                    }
                });
            });

            $('#voltarInicio').on('click', function (e) {
                e.preventDefault();

                // Check if any invoices are selected
                if ($('.quitarCheckbox:checked').length > 0) {
                    Swal.fire({
                        title: 'Deseja desmarcar todas as faturas?',
                        text: "Todas as faturas selecionadas serão desmarcadas.",
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonColor: '#3085d6',
                        cancelButtonColor: '#d33',
                        confirmButtonText: 'Sim, desmarcar',
                        cancelButtonText: 'Cancelar'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // Uncheck all checkboxes
                            $('.quitarCheckbox:checked').prop('checked', false);

                            // Update server for each
                            $('.quitarCheckbox').each(function () {
                                var invoiceNumber = $(this).data('invoice-number');
                                $.ajax({
                                    url: `/api/faturas/${invoiceNumber}/quitar`,
                                    method: 'PUT',
                                    contentType: 'application/json',
                                    data: JSON.stringify({ quitar: false })
                                });
                            });

                            // Navigate home
                            window.location.href = '/';
                        }
                    });
                } else {
                    window.location.href = '/';
                }
            });

            // Atualiza o total mensal ao carregar a página
            table.on('draw', function () {
                updateTotalMensal();
            });
        });
    </script>
</body>

</html>
