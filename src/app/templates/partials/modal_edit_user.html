{% for user in users %}
<div class="modal fade" id="editUserModal{{ user.id }}" tabindex="-1" aria-labelledby="editUserModalLabel{{ user.id }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editUserModalLabel{{ user.id }}">Editar Utilizador</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <form action="{{ url_for('users.edit_user', user_id=user.id) }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="username{{ user.id }}" class="form-label">Username</label>
            <input type="text" class="form-control" id="username{{ user.id }}" name="username" value="{{ user.username }}" required>
          </div>
          <div class="mb-3">
            <label for="display_name{{ user.id }}" class="form-label">Display Name</label>
            <input type="text" class="form-control" id="display_name{{ user.id }}" name="display_name" value="{{ user.display_name }}" required>
          </div>
          <div class="mb-3">
            <label for="email{{ user.id }}" class="form-label">Email</label>
            <input type="email" class="form-control" id="email{{ user.id }}" name="email" value="{{ user.email }}" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="is_admin{{ user.id }}" name="is_admin" {% if user.is_admin %}checked{% endif %}>
            <label class="form-check-label" for="is_admin{{ user.id }}">Administrador</label>
          </div>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endfor %}
