{% if session.get('is_admin') %}
<div class="modal fade" id="addUnitModal" tabindex="-1" aria-labelledby="addUnitModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addUnitModalLabel">Adicionar Unidade</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <form action="{{ url_for('units.add_unit') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="num_cliente" class="form-label">Número de Cliente</label>
            <input type="text" class="form-control" id="num_cliente" name="num_cliente" required>
          </div>
          <div class="mb-3">
            <label for="unidade" class="form-label">Unidade</label>
            <input type="text" class="form-control" id="unidade" name="unidade" required>
          </div>
          <div class="mb-3">
            <label for="poc" class="form-label">POC</label>
            <input type="text" class="form-control" id="poc" name="poc">
          </div>
          <div class="mb-3">
            <label for="email_poc" class="form-label">Email POC</label>
            <input type="email" class="form-control" id="email_poc" name="email_poc">
          </div>
          <button type="submit" class="btn btn-primary">Adicionar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endif %}
